<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetalLens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // FORCE UNREGISTER SERVICE WORKERS
      // This fixes the 404 error caused by stale PWA caches on mobile devices
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function(boolean) {
              console.log('Service Worker unregistered:', boolean);
            });
          }
        });
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jacquard+24&family=Jura:wght@400;600&family=UnifrakturMaguntia&family=Special+Elite&family=Uncial+Antiqua&display=swap');
      
      body {
        background-color: #000000;
        color: #e5e5e5;
        font-family: 'Jura', sans-serif;
        overflow-x: hidden;
      }
      
      h1, h2, h3, .font-typewriter {
        font-family: 'Special Elite', monospace;
      }

      .font-gothic {
        font-family: 'UnifrakturMaguntia', cursive;
        letter-spacing: 0.05em;
      }

      .font-uncial {
        font-family: "Uncial Antiqua", system-ui;
        font-weight: 600;
        font-style: normal;
      }

      .font-jacquard-24 {
        font-family: "Jacquard 24", system-ui;
        font-weight: 400;
        font-style: normal;
      }

      .font-unifrakturmaguntia {
        font-family: "UnifrakturMaguntia", cursive;
        font-weight: 500;
        font-style: normal;
      }



      /* Heavy Film Grain */
      .limbo-grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 50;
        opacity: 0.08;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
      }

      /* Heavy Vignette - Modified to be less intrusive on edges */
      .limbo-vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 40;
        background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.5) 75%, rgba(0,0,0,0.9) 100%);
      }

      /* Bloom Effect for Text */
      .text-bloom {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      
      /* Scrollbar - Minimalist/Invisible feel */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #404040; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #737373; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "uuid": "https://esm.sh/uuid@^9.0.1"
  }
}
</script>
</head>
  <body>
    <div class="limbo-grain"></div>
    <div class="limbo-vignette"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
